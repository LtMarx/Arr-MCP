x-common-env: &common-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-arr-env: &arr-env
  RADARR_URL: ${RADARR_URL:-}
  RADARR_API_KEY: ${RADARR_API_KEY:-}
  SONARR_URL: ${SONARR_URL:-}
  SONARR_API_KEY: ${SONARR_API_KEY:-}
  LIDARR_URL: ${LIDARR_URL:-}
  LIDARR_API_KEY: ${LIDARR_API_KEY:-}
  READARR_URL: ${READARR_URL:-}
  READARR_API_KEY: ${READARR_API_KEY:-}
  PROWLARR_URL: ${PROWLARR_URL:-}
  PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}

services:
  # stdio mode — launched by the MCP client directly (Claude Desktop)
  arr-mcp-stdio:
    build: .
    image: ghcr.io/ltmarx/arr-mcp:latest
    profiles: [stdio]
    stdin_open: true
    tty: false
    # No HTTP server in stdio mode, so there is nothing to probe.
    healthcheck:
      disable: true
    environment:
      <<: [*common-env, *arr-env]
      MCP_TRANSPORT: stdio

  # http mode — persistent server for remote MCP clients (ChatGPT, etc.)
  arr-mcp-http:
    build: .
    image: ghcr.io/ltmarx/arr-mcp:latest
    profiles: [http]
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3000}:${MCP_PORT:-3000}"
    # Probe is inline on purpose: it works on any image version and does not
    # depend on a file inside the image (a compose file referencing
    # docker-healthcheck.js breaks against images older than v1.5.0).
    # node is used rather than wget: it ignores http_proxy and targets IPv4
    # explicitly (the server binds 0.0.0.0, so ::1 would be refused).
    # curl is not installed in node:22-alpine at all.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get({host:'127.0.0.1',port:process.env.MCP_PORT||3000,path:'/health',timeout:4000},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      <<: [*common-env, *arr-env]
      MCP_TRANSPORT: http
      MCP_PORT: ${MCP_PORT:-3000}
      MCP_HOST: "0.0.0.0"
      # Set to 1 to also require every configured *ARR service to respond.
      HEALTHCHECK_DEEP: ${HEALTHCHECK_DEEP:-0}
